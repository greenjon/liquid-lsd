<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#7928ca" />
      <stop offset="100%" stop-color="#ff0080" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="20" fill="#0f141d"/>
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#grad1)" stroke-width="4" filter="url(#glow)"/>
  <polygon points="50,22 75,68 25,68" fill="none" stroke="#00d2ff" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="50,78 25,32 75,32" fill="none" stroke="#ff0080" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="50" cy="50" r="8" fill="#00d2ff" filter="url(#glow)"/>
</svg>
