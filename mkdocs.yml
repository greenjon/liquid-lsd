site_name: Liquid LSD
site_description: Documentation for the Liquid LSD real-time graphics and audio workstation.
theme:
  name: material
  palette:
    - scheme: dark
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - User Guide:
    - Core Concepts & Visual Sources: user_guide/concepts.md
    - CV Modulation & Preset Grid: user_guide/modulation.md
    - Documentation & Notes: user_guide/notes_and_tooltips.md
    - Presets & MIDI Mapping: user_guide/midi_presets.md
    - Library & Playlists: user_guide/library.md
    - Custom Shaders & Sources: user_guide/custom_visuals.md
  - Developer Reference:
    - Architecture Overview: developer/architecture.md
    - Real-Time Audio & DSP: developer/audio_dsp.md
    - Beat Sync & Stability: developer/beat_sync.md
    - Modulation Engine: developer/modulation.md
    - OpenGL Rendering: developer/rendering.md
    - UI Architecture & ImGui: developer/ui.md
    - Preset & Queue Management: developer/preset_management.md
    - Mandala UX Roadmap: developer/mandala_future_roadmap.md
  - Operations & Tuning: developer/ops_tuning.md
  - Release Notes: release_notes.md
