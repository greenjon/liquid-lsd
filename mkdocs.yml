site_name: Liquid LSD
site_description: Documentation for the Liquid LSD real-time graphics and audio workstation.
theme:
  name: material
  palette:
    - scheme: dark
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - search.highlight
    - search.share

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - User Guide:
    - Your Workspace: user_guide/your_workspace.md
    - Visual Sources: user_guide/visual_sources.md
    - Modulation: user_guide/modulation.md
    - Presets & Library: user_guide/presets_and_library.md
    - Output & Recording: user_guide/output_and_recording.md
    - Performance Controls: user_guide/performance_controls.md
    - Web Broadcast: user_guide/web_broadcast.md
  - Developer Reference:
    - Architecture Overview: developer/architecture.md
    - Real-Time Audio & DSP: developer/audio_dsp.md
    - Beat Sync & Stability: developer/beat_sync.md
    - Modulation Engine: developer/modulation.md
    - OpenGL Rendering: developer/rendering.md
    - Media Export & Recording Pipeline: developer/export_pipeline.md
    - Web Subsystem & Broadcast Protocol: developer/web_subsystem.md
    - UI Architecture & ImGui: developer/ui.md
    - ImGui Upgrade & Modernization: developer/imgui_upgrade_guide.md
    - Preset & Queue Management: developer/preset_management.md
    - Mandala UX Roadmap: developer/mandala_future_roadmap.md
  - Operations & Tuning: developer/ops_tuning.md
  - Release Notes: release_notes.md
