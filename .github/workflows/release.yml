name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0, v2.1.3-beta)
  workflow_dispatch: # Allows manually triggering the build from the GitHub UI

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # Needed to create tags, releases, and upload assets

jobs:
  build-and-package:
    name: Build & Package Distributions
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}
      v_num: ${{ steps.version.outputs.v_num }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine Version and Release Notes
        id: version
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          git fetch --tags --force || true
          python3 - << 'EOF'
          import os, re, subprocess

          ref = os.environ.get("GITHUB_REF", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          # 1. Determine Tag and Previous Tag
          tag_match = re.match(r"^refs/tags/(v.+)", ref)
          if tag_match:
              tag_name = tag_match.group(1)
              all_tags = subprocess.check_output(["git", "tag", "-l", "v*", "--sort=-v:refname"], text=True).splitlines()
              other_tags = [t for t in all_tags if t != tag_name]
              prev_tag = other_tags[0] if other_tags else ""
              print(f"Triggered by tag push: {tag_name} (previous tag: {prev_tag})")
          else:
              all_tags = subprocess.check_output(["git", "tag", "-l", "v*", "--sort=-v:refname"], text=True).splitlines()
              latest_tag = all_tags[0] if all_tags else ""
              if not latest_tag:
                  tag_name = "v1.0.0-beta.1"
                  prev_tag = ""
              else:
                  beta_match = re.match(r"^(v[0-9]+\.[0-9]+\.[0-9]+-beta\.)([0-9]+)$", latest_tag)
                  if beta_match:
                      tag_name = f"{beta_match.group(1)}{int(beta_match.group(2)) + 1}"
                  else:
                      tag_name = f"{latest_tag}-beta.1"
                  prev_tag = latest_tag

              print(f"Push to branch: Determined next tag {tag_name} (previous tag: {prev_tag})")

              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "tag", tag_name], check=True)
              subprocess.run(["git", "push", "origin", tag_name], check=True)

          v_num = tag_name.lstrip("v")

          # Export immediately to both GITHUB_OUTPUT and GITHUB_ENV
          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"tag_name={tag_name}\n")
                  f.write(f"v_num={v_num}\n")

          github_env = os.environ.get("GITHUB_ENV")
          if github_env:
              with open(github_env, "a", encoding="utf-8") as f:
                  f.write(f"RELEASE_TAG={tag_name}\n")
                  f.write(f"RELEASE_VNUM={v_num}\n")

          # 2. Extract release notes from docs/release_notes.md or RELEASE_NOTES.md
          candidate_files = [
              "docs/release_notes.md",
              "RELEASE_NOTES.md",
              "docs/RELEASE_NOTES.md",
              "release_notes.md",
              "RELEASES.md",
              "releases.md",
              "docs/RELEASES.md",
              "docs/releases.md",
          ]

          human_notes_body = ""
          for fpath in candidate_files:
              if os.path.exists(fpath):
                  with open(fpath, "r", encoding="utf-8") as f:
                      content = f.read()

                  # 2a. Match exact version heading (e.g. ## Version 1.0.0-beta.38)
                  pattern_version = rf"(##\s+Version\s+{re.escape(v_num)}.*?)(?=\n---\s*\n##\s+Version|\Z)"
                  match = re.search(pattern_version, content, re.DOTALL | re.IGNORECASE)

                  # 2b. If no exact match, look for an Unreleased heading
                  if not match:
                      pattern_unreleased = r"(##\s+\[?Unreleased\]?.*?)(?=\n---\s*\n##\s+|\Z)"
                      match = re.search(pattern_unreleased, content, re.DOTALL | re.IGNORECASE)

                  # 2c. Fallback: extract the topmost '## Version ...' section from the file
                  if not match:
                      pattern_top = r"(##\s+Version\s+[^\n]+.*?)(?=\n---\s*\n##\s+Version|\Z)"
                      match = re.search(pattern_top, content, re.DOTALL | re.IGNORECASE)

                  if match:
                      extracted = match.group(1).strip()
                      human_notes_body = re.sub(r"^##\s+(?:Version\s+[^\n]+|\[?Unreleased\]?)\s*", "", extracted, flags=re.IGNORECASE).strip()
                      break

          # 3. Assemble release body (Human-friendly notes + Git commit log)
          body = f"## Version {v_num}\n\n"
          if human_notes_body:
              body += f"{human_notes_body}\n\n---\n\n"

          body += f"### 📦 Commits in {tag_name}\n\n"
          if prev_tag:
              body += f"Changes since **{prev_tag}**:\n\n"
              commit_range = [f"{prev_tag}..HEAD"]
          else:
              commit_range = ["-n", "30"]

          try:
              cmd = ["git", "log"] + commit_range + [f"--pretty=format:- [%h](https://github.com/{repo}/commit/%H) %s (%an)"]
              commits = subprocess.check_output(cmd, text=True)
              body += commits + "\n"
          except Exception as e:
              body += f"- No commit history found ({e})\n"

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Automatically caches Gradle dependencies and build steps

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Install MkDocs and Material Theme
        run: |
          pipx install mkdocs
          pipx inject mkdocs mkdocs-material

      - name: Build and Package ZIPs
        run: ./gradlew packageZips --no-daemon

      - name: Upload Platform Distributions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-distributions
          path: build/distributions/*.zip
          retention-days: 2

      - name: Upload Release Notes Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release_notes.md
          retention-days: 2

  smoke-test-matrix:
    name: Smoke Test (${{ matrix.platform }})
    needs: build-and-package
    continue-on-error: true # Allow releasing passing platforms if a subset fails
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            zip: liquid-lsd-linux-x64.zip
            dir: liquid-lsd-linux-x64
            launcher: ./run-linux.sh

          - platform: linux-arm64
            os: ubuntu-24.04-arm
            zip: liquid-lsd-linux-arm64.zip
            dir: liquid-lsd-linux-arm64
            launcher: ./run-linux.sh

          - platform: macos-arm64
            os: macos-latest
            zip: liquid-lsd-macos-arm64.zip
            dir: liquid-lsd-macos-arm64
            launcher: ./run-mac-arm.command

          - platform: macos-x64
            os: macos-15-intel
            zip: liquid-lsd-macos-x64.zip
            dir: liquid-lsd-macos-x64
            launcher: ./run-mac-intel.command

          - platform: windows-x64
            os: windows-latest
            zip: liquid-lsd-windows-x64.zip
            dir: liquid-lsd-windows-x64
            launcher: ./run-windows.bat

    runs-on: ${{ matrix.os }}
    steps:
      - name: Download Platform Distributions
        uses: actions/download-artifact@v4
        with:
          name: platform-distributions
          path: dist

      - name: Extract Distribution ZIP
        shell: bash
        run: |
          mkdir -p test-run
          unzip -q dist/${{ matrix.zip }} -d test-run/
          find test-run -type f \( -name "*.sh" -o -name "*.command" -o -name "java" -o -name "jspawnhelper" \) -exec chmod +x {} + 2>/dev/null || true

      - name: Run Smoke Test (--version & --smoke-test)
        shell: bash
        working-directory: test-run/${{ matrix.dir }}
        run: |
          echo "=== Testing --version ==="
          ${{ matrix.launcher }} --version
          echo ""
          echo "=== Testing --smoke-test ==="
          ${{ matrix.launcher }} --smoke-test

      - name: Stage Verified Asset
        if: success()
        shell: bash
        run: |
          mkdir -p verified-assets
          cp dist/${{ matrix.zip }} verified-assets/

      - name: Upload Verified Asset Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: verified-${{ matrix.platform }}
          path: verified-assets/${{ matrix.zip }}
          retention-days: 1

  publish-release:
    name: Publish Verified Release
    needs: [build-and-package, smoke-test-matrix]
    if: always() && !cancelled() && needs.build-and-package.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: .

      - name: Download All Verified Assets
        uses: actions/download-artifact@v4
        with:
          pattern: verified-*
          path: verified-downloads
          merge-multiple: true

      - name: Inspect Verified Assets
        id: verify-summary
        run: |
          mkdir -p release-files
          cp verified-downloads/*.zip release-files/ 2>/dev/null || true
          COUNT=$(ls -1 release-files/*.zip 2>/dev/null | wc -l)
          echo "Verified distributions count: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: Zero platform distributions passed smoke testing. Aborting release!" >&2
            exit 1
          fi

          echo "Verified distributions ready for release:"
          ls -lh release-files/

          # Append verification summary to release notes
          echo -e "\n\n---\n### 🛡️ Automated Multi-Platform Verification\n" >> release_notes.md
          echo "The following platform binaries passed automated smoke testing on GitHub-hosted runners:" >> release_notes.md
          for f in release-files/*.zip; do
            [ -e "$f" ] || continue
            echo "- ✅ \`$(basename "$f")\`" >> release_notes.md
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-and-package.outputs.tag_name }}
          name: ${{ needs.build-and-package.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: release-files/*.zip
