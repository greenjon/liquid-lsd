name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0, v2.1.3-beta)
  workflow_dispatch: # Allows manually triggering the build from the GitHub UI

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # Needed to create tags, releases, and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version and Changelog
        id: version
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/(v.+) ]]; then
            TAG_NAME="${BASH_REMATCH[1]}"
            PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -v "^${TAG_NAME}$" | head -n 1 || true)
            echo "Triggered by tag push: $TAG_NAME (previous tag: $PREV_TAG)"
          else
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1 || true)
            if [ -z "$LATEST_TAG" ]; then
              TAG_NAME="v1.0.0-beta.1"
              PREV_TAG=""
            elif [[ "$LATEST_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+-beta\.)([0-9]+)$ ]]; then
              PREFIX="${BASH_REMATCH[1]}"
              NUM="${BASH_REMATCH[2]}"
              NEXT_NUM=$((NUM + 1))
              TAG_NAME="${PREFIX}${NEXT_NUM}"
              PREV_TAG="$LATEST_TAG"
            else
              TAG_NAME="${LATEST_TAG}-beta.1"
              PREV_TAG="$LATEST_TAG"
            fi
            echo "Push to branch: Determined next tag $TAG_NAME (previous tag: $PREV_TAG)"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG_NAME"
            git push origin "$TAG_NAME"
          fi

          if [[ "$TAG_NAME" == *"beta"* ]] || [[ "$TAG_NAME" == *"alpha"* ]] || [[ "$TAG_NAME" == *"rc"* ]]; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          # Generate release notes compiling commits since the previous tag
          {
            echo "### 📦 Changes in $TAG_NAME"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "Changes since **$PREV_TAG**:"
              echo ""
              git log "$PREV_TAG..HEAD" --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) %s (%an)"
            else
              echo "Commits in this release:"
              echo ""
              git log -n 30 --pretty=format:"- [%h](https://github.com/${{ github.repository }}/commit/%H) %s (%an)"
            fi
            echo ""
          } > release_notes.md

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Automatically caches Gradle dependencies and build steps

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Install MkDocs and Material Theme
        run: |
          pipx install mkdocs
          pipx inject mkdocs mkdocs-material

      - name: Build and Package ZIPs
        run: ./gradlew packageZips

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-distributions
          path: build/distributions/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: Release ${{ steps.version.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            build/distributions/liquid-lsd-windows-x64.zip
            build/distributions/liquid-lsd-linux-x64.zip
            build/distributions/liquid-lsd-linux-arm64.zip
            build/distributions/liquid-lsd-macos-arm64.zip
            build/distributions/liquid-lsd-macos-x64.zip
