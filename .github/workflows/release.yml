name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger on version tags (e.g., v1.0.0, v2.1.3-beta)
  workflow_dispatch: # Allows manually triggering the build from the GitHub UI

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # Needed to create tags, releases, and upload assets

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version and Release Notes
        id: version
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python3 -c '
          import os, re, subprocess

          ref = os.environ.get("GITHUB_REF", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")

          # 1. Determine Tag and Previous Tag
          tag_match = re.match(r"^refs/tags/(v.+)", ref)
          if tag_match:
              tag_name = tag_match.group(1)
              all_tags = subprocess.check_output(["git", "tag", "-l", "v*", "--sort=-v:refname"], text=True).splitlines()
              other_tags = [t for t in all_tags if t != tag_name]
              prev_tag = other_tags[0] if other_tags else ""
              print(f"Triggered by tag push: {tag_name} (previous tag: {prev_tag})")
          else:
              all_tags = subprocess.check_output(["git", "tag", "-l", "v*", "--sort=-v:refname"], text=True).splitlines()
              latest_tag = all_tags[0] if all_tags else ""
              if not latest_tag:
                  tag_name = "v1.0.0-beta.1"
                  prev_tag = ""
              else:
                  beta_match = re.match(r"^(v[0-9]+\.[0-9]+\.[0-9]+-beta\.)([0-9]+)$", latest_tag)
                  if beta_match:
                      tag_name = f"{beta_match.group(1)}{int(beta_match.group(2)) + 1}"
                  else:
                      tag_name = f"{latest_tag}-beta.1"
                  prev_tag = latest_tag

              print(f"Push to branch: Determined next tag {tag_name} (previous tag: {prev_tag})")

              subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
              subprocess.run(["git", "config", "user.email", "github-actions[bot]@users.noreply.github.com"], check=True)
              subprocess.run(["git", "tag", tag_name], check=True)
              subprocess.run(["git", "push", "origin", tag_name], check=True)

          # 2. Extract release notes from RELEASE_NOTES.md or docs/release_notes.md
          v_num = tag_name.lstrip("v")
          notes = ""
          for fpath in ["RELEASE_NOTES.md", "docs/release_notes.md"]:
              if os.path.exists(fpath):
                  with open(fpath, "r", encoding="utf-8") as f:
                      content = f.read()
                  pattern = rf"(##\s+Version\s+{re.escape(v_num)}.*?)(?=\n---\s*\n##\s+Version|\Z)"
                  match = re.search(pattern, content, re.DOTALL | re.IGNORECASE)
                  if match:
                      notes = match.group(1).strip()
                      break

          if notes:
              body = notes
          else:
              body = f"## Version {v_num}\n\n### 📦 Changes in {tag_name}\n\n"
              if prev_tag:
                  body += f"Changes since **{prev_tag}**:\n\n"
                  commit_range = f"{prev_tag}..HEAD"
              else:
                  commit_range = "-n 30"
              try:
                  commits = subprocess.check_output(
                      ["git", "log", commit_range, f"--pretty=format:- [%h](https://github.com/{repo}/commit/%H) %s (%an)"],
                      text=True
                  )
                  body += commits + "\n"
              except Exception as e:
                  body += f"- No commit history found ({e})\n"

          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(body + "\n")

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"tag_name={tag_name}\n")
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Automatically caches Gradle dependencies and build steps

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Install MkDocs and Material Theme
        run: |
          pipx install mkdocs
          pipx inject mkdocs mkdocs-material

      - name: Build and Package ZIPs
        run: ./gradlew packageZips

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platform-distributions
          path: build/distributions/*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: ${{ steps.version.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          make_latest: "true"
          generate_release_notes: true
          files: |
            build/distributions/liquid-lsd-windows-x64.zip
            build/distributions/liquid-lsd-linux-x64.zip
            build/distributions/liquid-lsd-linux-arm64.zip
            build/distributions/liquid-lsd-macos-arm64.zip
            build/distributions/liquid-lsd-macos-x64.zip
