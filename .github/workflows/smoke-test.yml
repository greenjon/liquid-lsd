name: 5-Platform Binary Smoke Test

on:
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle.kts'
      - 'gradle/**'
      - '.github/workflows/smoke-test.yml'
  workflow_dispatch:

jobs:
  build-imgui-arm64-native:
    name: Build imgui-java Linux ARM64 Native
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Cache imgui-java ARM64 Shared Library
        id: cache-imgui-arm64
        uses: actions/cache@v4
        with:
          path: libimgui-java64.so
          key: imgui-java-arm64-v1.92.7.1-v4

      - name: Setup JDK 17
        if: steps.cache-imgui-arm64.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Compiler Tools
        if: steps.cache-imgui-arm64.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y build-essential file

      - name: Build imgui-java ARM64 Shared Library
        if: steps.cache-imgui-arm64.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/bin
          cat << 'EOF' > /tmp/bin/g++
          #!/bin/bash
          ARGS=()
          for arg in "$@"; do
            case "$arg" in
              -m64|-mfpmath=*|-msse*|-Wl,-wrap,memcpy)
                ;;
              *)
                ARGS+=("$arg")
                ;;
            esac
          done
          exec /usr/bin/g++ "${ARGS[@]}"
          EOF

          cat << 'EOF' > /tmp/bin/gcc
          #!/bin/bash
          ARGS=()
          for arg in "$@"; do
            case "$arg" in
              -m64|-mfpmath=*|-msse*|-Wl,-wrap,memcpy)
                ;;
              *)
                ARGS+=("$arg")
                ;;
            esac
          done
          exec /usr/bin/gcc "${ARGS[@]}"
          EOF

          chmod +x /tmp/bin/g++ /tmp/bin/gcc
          export PATH="/tmp/bin:$PATH"

          git clone --depth 1 --branch v1.92.7.1 https://github.com/SpaiR/imgui-java.git imgui-java-src
          cd imgui-java-src
          git submodule update --init --recursive
          ./gradlew :imgui-binding:compileJava
          ./gradlew :imgui-binding:generateLibs -Denvs=linux -Dlocal

          IMGUI_SO="imgui-binding/build/libsNative/linux64/libimgui-java64.so"
          if [ ! -s "$IMGUI_SO" ]; then
            IMGUI_SO=$(find . -name "libimgui-java64.so" | head -n 1)
          fi

          if [ ! -s "$IMGUI_SO" ]; then
            echo "ERROR: libimgui-java64.so was not generated!" >&2
            exit 1
          fi

          cp "$IMGUI_SO" ../libimgui-java64.so
          cd ..
          file libimgui-java64.so

      - name: Upload ImGui ARM64 Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: imgui-java-arm64-so
          path: libimgui-java64.so
          retention-days: 1

  build-distributions:
    name: Build All Distribution ZIPs
    needs: build-imgui-arm64-native
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download ImGui ARM64 Native Library
        uses: actions/download-artifact@v4
        with:
          name: imgui-java-arm64-so
          path: src/main/resources/natives/linux-arm64/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Install MkDocs and Material Theme
        run: |
          pipx install mkdocs
          pipx inject mkdocs mkdocs-material

      - name: Build All Platform Distribution ZIPs
        run: ./gradlew packageZips --no-daemon

      - name: Upload Platform Distributions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: platform-distributions
          path: build/distributions/*.zip
          retention-days: 2

  smoke-test-matrix:
    name: Smoke Test (${{ matrix.platform }})
    needs: build-distributions
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            os: ubuntu-latest
            zip: liquid-lsd-linux-x64.zip
            dir: liquid-lsd-linux-x64
            launcher: ./run-linux.sh

          - platform: linux-arm64
            os: ubuntu-24.04-arm
            zip: liquid-lsd-linux-arm64.zip
            dir: liquid-lsd-linux-arm64
            launcher: ./run-linux-arm.sh

          - platform: macos-arm64
            os: macos-latest
            zip: liquid-lsd-macos-arm64.zip
            dir: liquid-lsd-macos-arm64
            launcher: ./run-mac-arm.command

          - platform: macos-x64
            os: macos-15-intel
            zip: liquid-lsd-macos-x64.zip
            dir: liquid-lsd-macos-x64
            launcher: ./run-mac-intel.command

          - platform: windows-x64
            os: windows-latest
            zip: liquid-lsd-windows-x64.zip
            dir: liquid-lsd-windows-x64
            launcher: ./run-windows.bat

    runs-on: ${{ matrix.os }}
    steps:
      - name: Download Platform Distributions
        uses: actions/download-artifact@v4
        with:
          name: platform-distributions
          path: dist

      - name: Extract Distribution ZIP
        shell: bash
        run: |
          mkdir -p test-run
          unzip -q dist/${{ matrix.zip }} -d test-run/
          # Ensure execution bits are preserved across shell scripts and bundled JRE executables
          find test-run -type f \( -name "*.sh" -o -name "*.command" -o -name "java" -o -name "jspawnhelper" \) -exec chmod +x {} + 2>/dev/null || true

      - name: Run Smoke Test (--version & --smoke-test)
        shell: bash
        working-directory: test-run/${{ matrix.dir }}
        run: |
          echo "=== Testing --version ==="
          ${{ matrix.launcher }} --version
          echo ""
          echo "=== Testing --smoke-test ==="
          ${{ matrix.launcher }} --smoke-test
