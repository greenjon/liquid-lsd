<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liquid LSD — Spaz Radio</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#2a2520">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="tv.css">
</head>
<body>
  <audio id="lsdAudio" crossorigin="anonymous" preload="none"></audio>

  <div id="tv-wrapper">
    <div id="tv-body">

      <!-- Screen area — canvas is sized to fill this via CSS -->
      <div id="tv-screen-border">
        <div id="tv-screen-area">
          <canvas id="glCanvas"></canvas>
          <!-- On-screen display: channel and look on every change, control feedback, now playing -->
          <div id="osd" aria-live="polite">
            <div id="osd-ch"></div>
            <div id="osd-msg"></div>
            <div id="osd-info">
              <div id="osd-name"></div>
              <div id="osd-chain"></div>
              <div id="osd-track"></div>
            </div>
          </div>
          <!-- Overlay shown when TV is off; hidden by .powered-on class -->
          <div id="screen-off-overlay"></div>
        </div>
      </div>

      <!-- Controls row below screen -->
      <div id="tv-controls">

        <!-- Power switch -->
        <div class="control-group">
          <button id="powerSwitch" class="power-switch" title="Power">
            <div class="switch-knob"></div>
          </button>
          <span class="control-label">PWR</span>
        </div>

        <!-- Volume dial -->
        <div class="control-group">
          <div id="volumeDial" class="rotary-dial">
            <div class="dial-marker"></div>
          </div>
          <span class="control-label">VOL</span>
        </div>

        <!-- Channel rocker: next / previous look -->
        <div class="control-group">
          <div class="rocker">
            <button id="chUp" class="rocker-btn" title="Next look (&rarr; or N)" aria-label="Next look">&#9650;</button>
            <button id="chDown" class="rocker-btn" title="Previous look (&larr; or P)" aria-label="Previous look">&#9660;</button>
          </div>
          <span class="control-label">CH</span>
        </div>

        <!-- Next FX chain on the look on air -->
        <div class="control-group">
          <button id="fxBtn" class="push-btn" title="Next FX chain on this look (F)" aria-label="Next FX chain"></button>
          <span class="control-label">FX</span>
        </div>

        <!-- Hold the current look -->
        <div class="control-group">
          <button id="holdBtn" class="push-btn latch" title="Hold this look (H or Space)" aria-label="Hold this look" aria-pressed="false"><span class="btn-led"></span></button>
          <span class="control-label">HOLD</span>
        </div>

        <!-- Service menu: SYNC, REACT, TIME, Reduced motion, Heavy looks -->
        <div class="control-group">
          <button id="menuBtn" class="push-btn" title="Menu: sync, reaction, look length, reduced motion, heavy looks (M)" aria-label="Menu"></button>
          <span class="control-label">MENU</span>
        </div>

        <!-- How long each look holds, in bars -->
        <div class="control-group">
          <div id="timeDial" class="rotary-dial" title="How long each look holds: drag, scroll or click ([ and ])" role="slider" aria-label="Look length in bars" tabindex="0">
            <div class="dial-marker"></div>
          </div>
          <span class="control-label" id="timeLabel">16 BARS</span>
        </div>

        <!-- How strongly the picture reacts to the audio -->
        <div class="control-group">
          <div id="reactDial" class="rotary-dial" title="How strongly the picture reacts to the music: drag or scroll; double-click for 100% (- and =)" role="slider" aria-label="Audio reaction" tabindex="0">
            <div class="dial-marker"></div>
          </div>
          <span class="control-label">REACT</span>
        </div>

        <!-- Station badge: power LED, beat LED (green = locked to the music's beat, amber = keeping time) -->
        <div id="station-badge">
          <div class="led" id="stationLed"></div>
          <div class="led beat-led" id="beatLed" title="Beat: green when locked to the music"></div>
          <span class="station-text">SPAZ RADIO &bull; CH.1</span>
        </div>

      </div><!-- /tv-controls -->

    </div><!-- /tv-body -->
  </div><!-- /tv-wrapper -->

  <script type="module" src="ui.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
