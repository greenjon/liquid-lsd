<!doctype html>
<meta charset="utf-8">
<title>LSD render check</title>
<iframe id="app" src="../index.html?nolive&nostatic" width="640" height="360" style="border:0"></iframe>
<script type="module">
import { parseDeckPreset, parseFxChain, parseTransition } from '../preset.js';
// Drives the real app in an iframe: powers it on, forces each source onto deck A, lets it
// render, reads the canvas inside the app's own rAF and POSTs stats + PNGs to /report.
const app = document.getElementById('app');
const errors = [];
const post = (o) => fetch('/report', { method: 'POST', body: JSON.stringify(o) });
// The preset.js import runs before this, so the frame may have loaded already: waiting for 'load' then
// would wait forever.
if (app.contentDocument?.readyState !== 'complete' || app.contentWindow.location.href === 'about:blank') await new Promise((r) => app.addEventListener('load', r));
const w = app.contentWindow;
w.addEventListener('error', (e) => errors.push(String(e.message)));
const origErr = w.console.error;
w.console.error = (...a) => { errors.push(a.map(String).join(' ').slice(0, 1500)); origErr.apply(w.console, a); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
for (let i = 0; i < 100 && !w.LSD; i++) await sleep(100);
if (!w.LSD) { await post({ fatal: 'app never initialised', errors }); }
else {
  w.document.getElementById('powerSwitch').click();
  const sources = await (await fetch('/sources')).json();
  const frames = [];
  const grab = () => new Promise((res) => w.requestAnimationFrame(() => {
    const c = w.document.getElementById('glCanvas');
    const png = c.toDataURL('image/png');
    const t = document.createElement('canvas'); t.width = c.width; t.height = c.height;
    const x = t.getContext('2d'); x.drawImage(c, 0, 0);
    const d = x.getImageData(0, 0, t.width, t.height).data;
    let sum = 0, lit = 0;
    for (let i = 0; i < d.length; i += 4) { const l = d[i] + d[i + 1] + d[i + 2]; sum += l; if (l > 30) lit++; }
    const glError = c.getContext('webgl2').getError();
    res({ png, glError, meanLuma: sum / (d.length / 4) / 3, litFraction: lit / (d.length / 4) });
  }));
  await sleep(2500); // warm-up
  // The autopilot's own startup and advance, before any spec overrides the decks
  const snap = () => {
    const st = w.LSD.autopilotState;
    return { deckA: { source: st.deckA?.source, fx0: st.deckA?.fx?.[0]?.id, params: Object.keys(st.deckA?.params ?? {}).length },
      deckBG: { source: st.deckBG?.source, fx0: st.deckBG?.fx?.[0]?.id }, transition: st.mixer.transition };
  };
  const autopilot = { start: snap() };
  await w.LSD.advanceForeground();
  await sleep(3200); // let the 2.5 s crossfade finish: the autopilot owns mixer.balance until it does
  autopilot.advanced = { ...snap(), deckB: { source: w.LSD.autopilotState.deckB?.source, fx0: w.LSD.autopilotState.deckB?.fx?.[0]?.id } };
  // There is no audio in headless Firefox: hold a music-like test signal in the shader audio textures for every
  // case (a kick pulsing twice a second, a tone, a falling noise floor), so the audio visualizers draw something.
  const af = w.LSD.audioFrame;
  af.hold = true;
  const feedAudio = (t) => {
    const s = t / 1000, kick = Math.exp(-(s % 0.5) * 8);
    for (let k = 0; k < af.spectrum.length; k++) {
      // real music sits around 0.5-0.8 here (-40..-16 dB), falling with frequency
      const floor = 0.8 - 0.3 * Math.log2(1 + k) / 9 + 0.08 * Math.sin(k * 0.7 + s * 3);
      af.spectrum[k] = Math.min(1, Math.max(0, floor + (k < 4 ? 0.2 * kick : 0) + (k === 10 || k === 11 ? 0.15 : 0)));
    }
    for (let i = 0; i < af.wave.length; i++) {
      af.wave[i] = 0.5 * kick * Math.sin(i * 0.02 + s * 6) + 0.2 * Math.sin(i * 0.31) + 0.05 * Math.sin(i * 2.1 + s);
    }
    w.requestAnimationFrame(feedAudio);
  };
  w.requestAnimationFrame(feedAudio);
  for (const spec of sources) {
    if (spec.wire) {
      // Replay wire-protocol messages through the same handler the WebSocket uses.
      w.LSD.autopilotState.isLiveBroadcast = false;
      for (const m of spec.wire) w.LSD.handleRelayMessage(m);
      await sleep(spec.settleMs ?? 1500);
      frames.push({ name: spec.name, ...(await grab()) });
      w.LSD.handleRelayMessage({ type: 'broadcaster_offline' });
      continue;
    }
    // Freeze the autopilot's hold/crossfade timers: after its 45 s hold it would crossfade away from the spec
    // being rendered (a long run then shows black or the wrong deck). Wire specs reset this themselves.
    w.LSD.autopilotState.isLiveBroadcast = true;
    const catalog = await (await fetch('/catalog.json')).json();
    const content = async (list, id) => (await (await fetch('/' + list.find((e) => e.id === id).file)).json());
    let deck = spec.deck;
    if (spec.preset) deck = parseDeckPreset(await (await fetch(spec.preset)).json());
    if (spec.chain) Object.assign(deck, parseFxChain(await content(catalog.fxChains, spec.chain)));
    if (spec.transitionPreset) spec.mixer = { ...spec.mixer, ...parseTransition(await content(catalog.transitionPresets, spec.transitionPreset)) };
    w.LSD.autopilotState.deckA = deck;
    w.LSD.autopilotState.deckB = spec.deckB ?? null;
    w.LSD.autopilotState.deckBG = null;
    w.LSD.autopilotState.mixer = Object.assign({ mode: 0, balance: 0, alpha: 1 }, spec.mixer);
    // Held audio signals (RC_LOUD): written every frame, since the DSP tick owns cvState while audio runs.
    let hold = null;
    if (spec.cv) {
      const pin = () => { Object.assign(w.LSD.cvState, spec.cv); hold = w.requestAnimationFrame(pin); };
      pin();
    }
    await sleep(spec.settleMs ?? 1500);
    let g = await grab();
    // Flight sources (gyroid_hyperspace) are genuinely empty for ~25% of their cycle, and a strobe in Black Gate
    // mode dips the whole frame to black (the_drop_weapon): resample a dark preset or chain frame a few times
    // before reporting it, so only one that stays dark fails.
    for (let retry = 0; (spec.preset || spec.chain) && retry < 4 && (g.meanLuma < 1 || g.litFraction < 0.01); retry++) { await sleep(700); g = await grab(); }
    frames.push({ name: spec.name, ...g });
    if (hold !== null) {
      w.cancelAnimationFrame(hold);
      for (const k of Object.keys(spec.cv)) w.LSD.cvState[k] = 0;
    }
  }
  const lib = w.LSD.library;
  await post({ autopilot, errors, frames, size: [app.width, app.height], library: { loaded: [...lib.programs.keys()], failed: [...lib.failed] } });
}
document.title = 'done';
</script>
