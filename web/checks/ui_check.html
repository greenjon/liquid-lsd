<!doctype html>
<meta charset="utf-8">
<title>LSD UI check</title>
<iframe id="app" src="../index.html?nolive&nostatic" width="1100" height="760" style="border:0"></iframe>
<script type="module">
import { createFakeBroker, fakeHistory } from '../tools/fakebroker.mjs';
// Drives the TV's viewer controls in the real page (driven by ui_check.mjs): power on, CH up/down, FX,
// HOLD, TIME, REACT, keyboard, and the live lock. POSTs {results:[{name, ok, detail}]} to /report.
const app = document.getElementById('app');
const results = [];
const check = (name, ok, detail = '') => results.push({ name, ok: !!ok, detail: String(detail) });
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const post = (o) => fetch('/report', { method: 'POST', body: JSON.stringify(o) });
try {
  // The fake-broker import runs before this, so the frame may have loaded already.
  if (app.contentDocument?.readyState !== 'complete' || app.contentWindow.location.href === 'about:blank') await new Promise((r) => app.addEventListener('load', r));
  const w = app.contentWindow, d = w.document;
  for (let i = 0; i < 100 && !w.LSD; i++) await sleep(100);
  const st = w.LSD.autopilotState;
  const errors = [];
  w.addEventListener('error', (e) => errors.push(e.message));
  const key = (k) => w.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true }));
  const onAir = () => (st.mixer.balance > 0.5 ? st.deckB : st.deckA);
  const osd = (id) => ({ text: d.getElementById(id).textContent, shown: d.getElementById(id).classList.contains('show') });

  // The whole TV is a power target: a click on the screen of a TV that is off turns it on.
  d.getElementById('tv-screen-area').click();
  await sleep(1500);
  check('First power-on plays the Liquid LSD ident', d.getElementById('ident').classList.contains('show'));
  await sleep(3800);
  check('ANNOUNCE SCENES is off by default: no scene name after power on', !osd('osd-name').shown, JSON.stringify(osd('osd-name')));
  check('REACT starts at 100%', w.LSD.viewerState.react === 1, w.LSD.viewerState.react);
  key('i');
  check('I shows the channel', osd('osd-ch').shown && /^CH \d+/.test(osd('osd-ch').text), JSON.stringify(osd('osd-ch')));
  check('I names the scene', osd('osd-name').text.length > 0, osd('osd-name').text);

  // Dragging a knob and letting go over the TV must not click the TV (power off).
  const dial = d.getElementById('reactDial');
  dial.dispatchEvent(new w.MouseEvent('mousedown', { bubbles: true, clientY: 300 }));
  w.dispatchEvent(new w.MouseEvent('mousemove', { bubbles: true, clientY: 290 }));
  w.dispatchEvent(new w.MouseEvent('mouseup', { bubbles: true, clientY: 290 }));
  d.getElementById('tv-body').dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
  check('A knob drag released over the TV leaves it on', w.LSD.powerState.on);
  dial.dispatchEvent(new w.MouseEvent('dblclick', { bubbles: true })); // double-click: back to 100%
  check('Double-click puts REACT back to 100%', w.LSD.viewerState.react === 1, w.LSD.viewerState.react);
  check('Screen kept awake while on (where the browser has wake lock)', !('wakeLock' in w.navigator) || w.LSD.viewerState.awake);
  const meta = w.navigator.mediaSession?.metadata;
  check('Lock screen shows the station and the scene', !w.navigator.mediaSession || (meta?.artist === 'Spaz Radio' && /Liquid LSD/.test(meta.album)), meta ? `${meta.title} / ${meta.album}` : 'none');

  // GPU probe at power-on: heavy sources only rotate when it is fast enough.
  const gpu = w.LSD.gpu;
  check('GPU probe ran at power-on', gpu.state === 'done' && gpu.ms > 0, JSON.stringify(gpu));
  results.push({ name: `(info) GPU probe ${gpu.ms?.toFixed(1)} ms, heavy sources ${gpu.heavy ? 'on' : 'off'}`, ok: true, detail: '' });
  const heavy = new Set((await (await fetch('../settings.json')).json()).heavySources);
  const seen = [];
  for (let i = 0; i < 8; i++) { d.getElementById('chUp').click(); await sleep(2600); seen.push(onAir().source); }
  check('CH up never brings a heavy source when the probe said no', gpu.heavy || !seen.some((s) => heavy.has(s)), seen.join(','));

  const first = onAir();
  d.getElementById('chUp').click();
  await sleep(3000);
  check('CH up crossfades to another scene', onAir() !== first && st.mixer.balance > 0.99, `balance ${st.mixer.balance}`);
  const second = onAir();
  d.getElementById('chDown').click();
  await sleep(3000);
  check('CH down returns to the previous scene', onAir() === first, `balance ${st.mixer.balance}`);
  d.getElementById('chUp').click();
  await sleep(3000);
  check('CH up after CH down is the channel it left', onAir() === second, `balance ${st.mixer.balance}`);

  key('ArrowRight');
  await sleep(3000);
  check('Right arrow is CH up', onAir() !== first);

  const before = onAir().chainName;
  let changed = false;
  for (let i = 0; i < 4 && !changed; i++) { d.getElementById('fxBtn').click(); await sleep(300); changed = onAir().chainName !== before; }
  check('FX changes the chain on air', changed, `${before} -> ${onAir().chainName}`);

  d.getElementById('holdBtn').click();
  check('HOLD latches', st.hold && d.getElementById('holdBtn').getAttribute('aria-pressed') === 'true');
  key('h');
  check('H releases HOLD', !st.hold);

  key(']');
  check('] lengthens the scene (TIME dial)', d.getElementById('timeLabel').textContent === '32 BARS', d.getElementById('timeLabel').textContent);
  key('[');
  const react0 = w.LSD.viewerState.react;
  key('=');
  check('= raises REACT', w.LSD.viewerState.react > react0, `${react0} -> ${w.LSD.viewerState.react}`);
  key('-');

  // Service MENU: M opens it, it owns the arrows (no scene change), SYNC moves in 10 ms steps, Esc closes.
  const lookBefore = onAir();
  key('m');
  const menuEl = d.getElementById('tv-menu');
  check('M opens the menu', menuEl && !menuEl.hidden);
  check('Menu: the title shows the TV version', /^v\d+$/.test(menuEl.querySelector('.menu-version')?.textContent ?? ''), menuEl.querySelector('.menu-title').textContent);
  key('ArrowRight'); key('ArrowRight'); key('ArrowRight');
  check('Menu: right arrow raises SYNC by 10 ms steps', w.LSD.viewerState.syncMs === 30, w.LSD.viewerState.syncMs);
  await sleep(3000);
  check('Menu: the arrows do not change the scene while it is open', onAir() === lookBefore);
  key('ArrowDown'); key('ArrowDown'); key('ArrowDown'); key('ArrowDown'); key('ArrowDown'); key('ArrowRight');
  check('Menu: reduced motion row cycles AUTO -> ON', w.LSD.viewerState.reducedMode === 'on', w.LSD.viewerState.reducedMode);
  key('ArrowLeft'); key('ArrowUp'); key('ArrowUp'); key('ArrowUp'); key('ArrowUp'); key('ArrowUp'); key('ArrowLeft'); key('ArrowLeft'); key('ArrowLeft');
  check('Menu: back to defaults', w.LSD.viewerState.syncMs === 0 && w.LSD.viewerState.reducedMode === 'auto', `${w.LSD.viewerState.syncMs} ${w.LSD.viewerState.reducedMode}`);
  key('ArrowDown'); key('ArrowDown');
  check('Menu: the selected row explains itself', /name of each new scene/.test(menuEl.querySelector('.menu-hint').textContent), menuEl.querySelector('.menu-hint').textContent);
  key('ArrowRight');
  check('Menu: ANNOUNCE SCENES turns on', w.LSD.viewerState.announce === true);
  key('ArrowRight');
  check('Menu: ANNOUNCE SCENES turns off', w.LSD.viewerState.announce === false);
  const labels = [...menuEl.querySelectorAll('.menu-label')].map((e) => e.textContent);
  check('Menu: has INPUT and FULLSCREEN rows', labels.includes('INPUT') && labels.includes('FULLSCREEN'), labels.join(','));
  menuEl.querySelectorAll('.menu-label')[0].click(); // re-renders the menu under the click
  check('Menu: clicking a row label leaves the TV on', w.LSD.powerState.on);
  check('Menu: clicking a row label keeps the menu open', !menuEl.hidden);
  key('Escape');
  check('Esc closes the menu', menuEl.hidden);

  // Reduced motion: no hard scenes, no strobe/glitch chains and no flash transitions come on air.
  const settingsJson = await (await fetch('../settings.json')).json();
  w.LSD.viewerState.reducedMode = 'on';
  key('m'); for (let i = 0; i < 5; i++) key('ArrowDown'); key('ArrowRight'); key('ArrowLeft'); key('Escape'); // applies 'on'
  const calmSeen = [];
  for (let i = 0; i < 6; i++) {
    d.getElementById('chUp').click(); await sleep(4600); // fades are twice as long
    calmSeen.push({ tags: onAir().tags ?? [], chain: onAir().chainName, trans: st.mixer.transition });
  }
  check('Reduced motion: no hard scenes', !calmSeen.some((c) => c.tags.includes('hard')), calmSeen.map((c) => c.tags.join('/')).join(' '));
  check('Reduced motion: no flash transitions', !calmSeen.some((c) => ['luminous_flash', 'cyber_datamosh', 'film_burn'].includes(c.trans)), calmSeen.map((c) => c.trans).join(','));
  check('Reduced motion: REACT is capped', w.LSD.viewerState.reducedNow === true);
  w.LSD.viewerState.reducedMode = 'off';
  key('m'); for (let i = 0; i < 5; i++) key('ArrowDown'); key('ArrowRight'); key('ArrowLeft'); key('Escape');
  check('Reduced motion off again', w.LSD.viewerState.reducedNow === false);

  // Song sections: a breakdown brings a calm or building scene at the next bar line, the drop cuts to a hard one.
  const tagsOnAir = () => onAir().tags ?? [];
  w.LSD.cvState.section = 'breakdown';
  await sleep(5000);
  check('Breakdown: a calm or building scene comes in', tagsOnAir().some((t) => ['ambient', 'build'].includes(t)), tagsOnAir().join(','));
  w.LSD.cvState.drops += 1;
  w.LSD.cvState.section = 'normal';
  await sleep(700);
  check('Drop: the cut uses the drop flash', st.mixer.transition === 'luminous_flash', st.mixer.transition);
  check('Drop: a hard scene cuts in', tagsOnAir().some((t) => ['hard', 'bass-gated'].includes(t)) && st.mixer.balance % 1 === 0, `${tagsOnAir().join(',')} balance ${st.mixer.balance}`);

  // Live broadcast locks the controls.
  w.LSD.handleRelayMessage({ type: 'state_full', v: 2, clock: { beats: 0, bpm: 120 }, preset: {
    deckA: { source: 'mandala', params: {}, fx: { 0: null, 1: null, 2: null } }, deckB: { empty: true }, deckBG: { empty: true },
    mixer: { balance: 0, alpha: 1, transition: 'linear_crossfade', transitionParams: {}, fx: { 0: null, 1: null, 2: null } },
    broadcaster: 'DJ Test' } });
  await sleep(200);
  // TAP SYNC against the live clock (120 BPM): 8 steady taps give a SYNC inside the menu's range.
  key('m'); key('ArrowDown'); key('Enter');
  for (let i = 0; i < 8; i++) { key(' '); await sleep(500); }
  const syncAfterTaps = w.LSD.viewerState.syncMs;
  check('TAP SYNC: steady taps set SYNC', /^SYNC /.test(osd('osd-msg').text) && syncAfterTaps >= -100 && syncAfterTaps <= 400, `${osd('osd-msg').text} ${syncAfterTaps}`);
  w.LSD.viewerState.syncMs = 0;
  const liveDeck = st.deckA;
  d.getElementById('chUp').click();
  d.getElementById('holdBtn').click();
  await sleep(500);
  const card = d.getElementById('title-card');
  check('Live: the title card shows LIVE and the broadcaster', card.classList.contains('show') && card.textContent.includes('DJ Test'), card.textContent);
  check('Live: badge says LIVE', d.querySelector('#station-badge .station-text').textContent.includes('LIVE'));
  check('Live: CH up and HOLD do nothing', st.deckA === liveDeck && !st.hold);
  check('Live: OSD says controls are locked', osd('osd-msg').text.includes('LOCKED'), osd('osd-msg').text);
  w.LSD.handleRelayMessage({ type: 'broadcaster_offline' });
  await sleep(300);
  check('Offline: badge back to CH.1', d.querySelector('#station-badge .station-text').textContent.includes('CH.1'));
  // Branding: I adds the Liquid LSD line; MENU › ABOUT opens and any key closes it; the bumper; the nameplate.
  key('i');
  check('I shows the Liquid LSD line', osd('osd-brand').shown && osd('osd-brand').text.includes('liquid-lsd.greenjon.com'));
  key('m'); for (let i = 0; i < 12; i++) key('ArrowDown'); key('Enter'); // row 12 = ABOUT
  const aboutEl = d.getElementById('about');
  check('MENU › ABOUT opens the about page', !aboutEl.hidden && aboutEl.textContent.includes('greenjon'), aboutEl.hidden);
  key('x');
  check('Any key closes ABOUT', aboutEl.hidden);
  // SCHEDULE: a fixture instead of the network (?nolive skips the fetch); button, G, MENU row, any key, click.
  const H = 3600e3, t0 = Date.now();
  const sched = w.LSD.viewerState.schedule;
  sched.setShows([
    { start: t0 - H, end: t0 + H, name: 'Blind Spot Radio' },
    { start: t0 + 2 * H, end: t0 + 3 * H, name: "Spukkin Faceship's <b>Spaceship</b>" },
    { start: t0 + 50 * H, end: t0 + 52 * H, name: 'Telepathic Bubblebath' },
  ]);
  const schedEl = d.getElementById('schedule');
  d.getElementById('scheduleBtn').click();
  check('SCHEDULE button opens the schedule', !schedEl.hidden);
  check('Schedule: the show on air is marked ON AIR', schedEl.querySelector('.sc-show.on-air')?.textContent.includes('ON AIR') && schedEl.querySelector('.sc-show.on-air').textContent.includes('Blind Spot Radio'), schedEl.querySelector('.sc-list').textContent);
  check('Schedule: names are text, not markup', schedEl.textContent.includes('<b>Spaceship</b>') && !schedEl.querySelector('.sc-list b'));
  check('Schedule: grouped by day', [...schedEl.querySelectorAll('.sc-day')].length >= 2 && schedEl.querySelector('.sc-day').textContent === 'TODAY', [...schedEl.querySelectorAll('.sc-day')].map((e) => e.textContent).join(','));
  check('Schedule: says which time zone', /^TIMES IN \S+/.test(schedEl.querySelector('.sc-zone').textContent), schedEl.querySelector('.sc-zone').textContent);
  key('ArrowRight');
  check('Any key closes the schedule', schedEl.hidden);
  key('g');
  check('G opens the schedule', !schedEl.hidden);
  schedEl.click();
  check('A click closes the schedule and leaves the TV on', schedEl.hidden && w.LSD.powerState.on);
  key('m'); for (let i = 0; i < 11; i++) key('ArrowDown'); key('Enter'); // row 11 = SCHEDULE
  check('MENU › SCHEDULE opens the schedule and closes the menu', !schedEl.hidden && menuEl.hidden);
  key('Escape');
  key('i');
  check('The OSD names the next show', osd('osd-next').shown && osd('osd-next').text.startsWith("NEXT: Spukkin Faceship's"), JSON.stringify(osd('osd-next')));
  key('g');
  d.getElementById('powerSwitch').click();
  await sleep(100);
  check('Power off hides the schedule', schedEl.hidden || getComputedStyle(schedEl).display === 'none');
  d.getElementById('powerSwitch').click();
  await sleep(1800);
  check('Schedule stays closed after power on', schedEl.hidden);
  w.LSD.viewerState.showBumper();
  check('Bumper names Liquid LSD and the site', d.getElementById('bumper').classList.contains('show') && /LIQUID-LSD\.GREENJON\.COM/.test(d.getElementById('bumper').textContent));
  const plate = d.getElementById('nameplate');
  check('Nameplate links to the site', plate.href === 'https://liquid-lsd.greenjon.com/' && plate.target === '_blank');
  plate.addEventListener('click', (e) => e.preventDefault(), { once: true }); // don't open a tab in the check
  plate.click();
  check('Clicking the nameplate does not turn the TV off', w.LSD.powerState.on);

  // Clicking the picture while on does not turn it off; clicking the cabinet does, and again turns it on.
  d.getElementById('glCanvas').click();
  check('A click on the picture leaves the TV on', w.LSD.powerState.on);
  d.getElementById('tv-controls').click();
  check('A click on the cabinet turns the TV off', !w.LSD.powerState.on);
  d.getElementById('tv-body').click();
  check('A click on the TV turns it on again', w.LSD.powerState.on);
  // CHAT: the blackboard, on a fake broker and log (?nolive never starts the real room).
  const board = d.getElementById('chalkboard'), chatBtn = d.getElementById('chatBtn');
  const cb = w.LSD.viewerState.chat;
  check('Chat board is open on a first visit', !board.hidden && d.body.classList.contains('chat-open') && getComputedStyle(board).display !== 'none');
  const tvBox = d.getElementById('tv-body').getBoundingClientRect(), boardBox = board.getBoundingClientRect();
  check('Chat board hangs beside the TV, inside the window, as tall as the cabinet',
    boardBox.left >= tvBox.right && boardBox.right <= w.innerWidth && Math.abs(boardBox.height - tvBox.height) < 2,
    `tv ${tvBox.left|0}-${tvBox.right|0} h${tvBox.height|0}, board ${boardBox.left|0}-${boardBox.right|0} h${boardBox.height|0}, window ${w.innerWidth}`);
  check('Chat board has a close X', !!board.querySelector('.cb-close[aria-label="Close chat"]'));
  check('Chat waits for the check under ?nolive (no real room)', cb.chat.state.status === 'idle');
  const broker = createFakeBroker();
  broker.retained.set('presence/mutabu', 'abu');
  const t1 = Date.now();
  cb.chat.useTransport({ WebSocketImpl: broker.WebSocket, fetchImpl: fakeHistory([
    { user: 'abu', message: 'earlier &amp; <i>wiser</i> https://spaz.org/tv/', time_received: t1 - 60000 },
  ]) });
  cb.chat.start();
  await sleep(300);
  const log = board.querySelector('.cb-log');
  check('Chat shows the log, links and all, as text', log.textContent.includes('earlier & wiser') && !log.querySelector('i')
    && log.querySelector('a')?.href === 'https://spaz.org/tv/' && log.querySelector('a').rel.includes('noopener'), log.textContent);
  check('Chat shows who is here', /1 here: abu/.test(board.querySelector('.cb-roster').textContent), board.querySelector('.cb-roster').textContent);
  const input = board.querySelector('.cb-input'), form = board.querySelector('.cb-form');
  check('Chat asks for a name first', /name/.test(input.placeholder), input.placeholder);
  const onAirBefore = onAir();
  input.focus();
  for (const k of ['n', 'm', 'c', ' ']) input.dispatchEvent(new w.KeyboardEvent('keydown', { key: k, bubbles: true }));
  check('Typing in the chat leaves the TV keys alone (n, m, c, space)', onAir() === onAirBefore && menuEl.hidden && !board.hidden);
  input.value = 'tester';
  form.requestSubmit();
  await sleep(200);
  check('Joining puts the name in the room', broker.retained.get(`presence/${cb.chat.clientId}`) === 'tester' && /tester/.test(board.querySelector('.cb-roster').textContent));
  input.value = 'hello from the check';
  form.requestSubmit();
  await sleep(300);
  const sent = broker.published.filter((p) => p.topic === 'spazradio').map((p) => p.payload);
  check('Sending posts {user, message} on spazradio', sent.length === 1 && JSON.parse(sent[0]).user === 'tester' && JSON.parse(sent[0]).message === 'hello from the check', sent.join(' | '));
  const last = [...log.querySelectorAll('.cb-msg')].at(-1);
  check('Your own line comes back in yellow, with a time', last?.textContent.includes('hello from the check') && !!last.querySelector('.cb-mine') && !!last.querySelector('.cb-time')?.textContent, last?.outerHTML);
  check('The box is empty again after sending', input.value === '');
  board.querySelector('.cb-close').click();
  check('The X closes the board, and the TV takes the room back', board.hidden && !d.body.classList.contains('chat-open') && getComputedStyle(board).display === 'none'
    && d.getElementById('tv-body').getBoundingClientRect().width > tvBox.width);
  check('Closing is remembered', w.localStorage.getItem('lsd.chat.open') === '0');
  broker.inject('spazradio', JSON.stringify({ user: 'abu', message: 'you there?' }));
  await sleep(100);
  check('A new line while closed lights the CHAT LED', chatBtn.classList.contains('unread'));
  key('c');
  check('C opens the board and the LED goes out', !board.hidden && !chatBtn.classList.contains('unread'));
  chatBtn.click();
  check('The CHAT button closes it', board.hidden);
  key('m'); for (let i = 0; i < 10; i++) key('ArrowDown');
  check('MENU has a CHAT row', menuEl.querySelector('.menu-row.sel')?.textContent.includes('CHAT') && menuEl.querySelector('.menu-row.sel').textContent.includes('CLOSED'), menuEl.querySelector('.menu-row.sel')?.textContent);
  key('Enter');
  check('MENU › CHAT opens the board', !board.hidden);
  key('Escape');
  cb.chat.leave();
  await sleep(50);
  check('Leaving the page clears our name from the room', !broker.retained.has(`presence/${cb.chat.clientId}`));
  check('No page errors', errors.length === 0, errors.join(' | '));
  await post({ results });
} catch (err) {
  await post({ fatal: String(err && err.stack || err), results });
}
</script>
